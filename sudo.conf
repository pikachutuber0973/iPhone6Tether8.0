# /etc/sudo.conf
#
# Default configuration for sudo. This is the stock content shipped by
# Debian/Ubuntu's sudo package. Only restore this file if your original
# /etc/sudo.conf is genuinely corrupted (garbled, truncated, or contains
# unrecognized directives) — the "must be only be writable by owner" error
# is a PERMISSIONS problem, not a content problem, so in most cases you
# only need fix-sudo-perms.sh, not this file.
#
# Format:
#   Plugin plugin_name plugin_path plugin_options ...
#
# The plugin_path is relative to /usr/lib/sudo unless it is fully qualified.
# The plugin_options are optional.
#
# Path to the security policy plugin
Plugin sudoers_policy sudoers.so
#
# Path to the I/O plugin (must be enabled with the 'I' setting in sudoers)
Plugin sudoers_io sudoers.so
#
# The sudo_debug plugin repeats debug messages sent by other plugins.
# Uncomment to enable debugging output for sudo/sudoedit itself.
#Debug sudo /var/log/sudo_debug all@warn
#
# Uncomment to enable core dumps when sudo aborts abnormally.
#Set disable_coredump false
