# /etc/sudo.conf
#
# Stock sudo.conf. The Plugin lines below are commented out on purpose —
# leaving them commented tells sudo to use its own compiled-in default
# path for sudoers.so, which matches wherever your distro's package
# actually installed it. Explicitly setting "Plugin sudoers_policy
# sudoers.so" only works if that relative path resolves correctly, and
# on multiarch systems (Debian/Ubuntu) the real path is often something
# like /usr/lib/x86_64-linux-gnu/sudo/sudoers.so, not /usr/lib/sudo/ —
# an incorrect override here is a common cause of "unable to load
# plugins" even after permissions are fixed.
#
# Only uncomment and edit these if `sudo -l` still fails after running
# fix-sudo-perms.sh AND you've confirmed the real path with:
#   find / -xdev -name 'sudoers.so' 2>/dev/null
#
Plugin sudoers_policy sudoers.so
Plugin sudoers_io sudoers.so

# Uncomment to send sudo's own debug output to a log file
#Debug sudo /var/log/sudo_debug all@warn

# Uncomment to allow core dumps if sudo crashes (debugging only)
#Set disable_coredump false
e
